<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diepvries">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diepvries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --surface: #1e293b;
  --surface2: #263348;
  --border: rgba(148,163,184,0.15);
  --border2: rgba(148,163,184,0.28);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --blue: #38bdf8;
  --blue-bg: rgba(56,189,248,0.12);
  --blue-text: #7dd3fc;
  --amber: #fbbf24;
  --amber-bg: rgba(251,191,36,0.12);
  --amber-text: #fde68a;
  --green: #34d399;
  --green-bg: rgba(52,211,153,0.12);
  --green-text: #6ee7b7;
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.12);
  --red-text: #fca5a5;
  --radius: 14px;
  --radius-sm: 9px;
  --font: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

/* Layout */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#topbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; padding-top: max(14px, env(safe-area-inset-top)); }
#topbar h1 { font-size: 20px; font-weight: 500; flex: 1; letter-spacing: -0.3px; }
.hbtn { display: flex; align-items: center; gap: 5px; font-size: 13px; font-family: var(--font); font-weight: 400; padding: 7px 12px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text2); cursor: pointer; }
.hbtn:active { opacity: 0.7; }
#tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex-shrink: 0; background: var(--bg); border-bottom: 1px solid var(--border); }
.tab { padding: 12px; font-size: 15px; font-family: var(--font); font-weight: 400; text-align: center; cursor: pointer; background: transparent; color: var(--text3); border: none; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.tab.active-w { color: var(--blue); border-bottom-color: var(--blue); }
.tab.active-b { color: var(--amber); border-bottom-color: var(--amber); }
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px; padding-bottom: max(80px, calc(env(safe-area-inset-bottom) + 80px)); }
#bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-shrink: 0; }
#fab { flex: 1; padding: 13px; font-size: 15px; font-weight: 500; font-family: var(--font); border: none; border-radius: var(--radius); cursor: pointer; }
.fab-w { background: var(--blue); color: #0f172a; }
.fab-b { background: var(--amber); color: #0f172a; }
.scan-fab { padding: 13px 16px; font-size: 15px; font-family: var(--font); border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text2); cursor: pointer; }

/* Stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat { background: var(--surface); border-radius: var(--radius-sm); padding: 11px 14px; border: 1px solid var(--border); }
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .05em; }
.stat-value { font-size: 22px; font-weight: 300; }

/* Sort/Search */
.controls { display: flex; gap: 8px; margin-bottom: 12px; }
.controls select, .controls input { flex: 1; font-size: 13px; font-family: var(--font); padding: 8px 10px; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); outline: none; }
.list-meta { font-size: 12px; color: var(--text3); margin-bottom: 10px; font-family: var(--mono); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.card.expired { border-color: rgba(248,113,113,0.4); }
.card.soon { border-color: rgba(251,191,36,0.35); }
.card-main { display: flex; align-items: center; gap: 11px; padding: 12px 13px; }
.card-thumb { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 21px; background: var(--bg2); border: 1px solid var(--border); overflow: hidden; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.card-badges { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 400; white-space: nowrap; }
.b-ok { background: var(--green-bg); color: var(--green-text); }
.b-soon { background: var(--amber-bg); color: var(--amber-text); }
.b-exp { background: var(--red-bg); color: var(--red-text); }
.b-date { background: var(--bg3); color: var(--text2); font-family: var(--mono); }
.card-ctrl { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
.qty-row { display: flex; align-items: center; gap: 5px; }
.qb { width: 26px; height: 26px; border: 1px solid var(--border2); border-radius: 7px; background: var(--bg2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--font); }
.qb:active { background: var(--bg3); }
.qn { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; font-family: var(--mono); }
.unit-lbl { font-size: 10px; color: var(--text3); }
.del-btn { width: 26px; height: 26px; border: none; background: transparent; color: var(--text3); font-size: 15px; cursor: pointer; }
.card-footer { border-top: 1px solid var(--border); padding: 8px 13px; display: flex; gap: 12px; align-items: center; }
.foot-btn { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--font); padding: 0; }
.foot-btn:active { color: var(--text); }
.note-body { padding: 10px 13px; font-size: 13px; color: var(--text2); line-height: 1.55; border-top: 1px solid var(--border); }

/* Empty */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty p { font-size: 14px; }

/* Scanner overlay */
#scanner-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 100; flex-direction: column; }
#scanner-overlay.open { display: flex; }
#scanner-video { width: 100%; flex: 1; object-fit: cover; }
.scanner-ui { padding: 20px 20px max(20px, env(safe-area-inset-bottom)); background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
.scanner-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-60%); width: 220px; height: 140px; pointer-events: none; }
.scanner-frame::before, .scanner-frame::after { content: ''; position: absolute; width: 30px; height: 30px; border-color: var(--blue); border-style: solid; }
.scanner-frame::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
.scanner-frame::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
.sf2::before { content: ''; position: absolute; top: 0; right: 0; width: 30px; height: 30px; border: 2px solid transparent; border-top-color: var(--blue); border-right-color: var(--blue); }
.sf2::after { content: ''; position: absolute; bottom: 0; left: 0; width: 30px; height: 30px; border: 2px solid transparent; border-bottom-color: var(--blue); border-left-color: var(--blue); }
.scanner-line { position: absolute; left: 10px; right: 10px; height: 1px; background: var(--blue); animation: scan 2s ease-in-out infinite; top: 20px; opacity: 0.7; }
@keyframes scan { 0%,100%{ top: 15px; } 50%{ top: 115px; } }
#scanner-status { font-size: 14px; color: var(--text2); text-align: center; }
#scanner-manual { font-size: 13px; color: var(--text3); text-align: center; }
.scanner-close-btn { padding: 13px; font-size: 15px; font-family: var(--font); border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text2); cursor: pointer; }

/* Add/Edit sheet */
#sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: flex-end; }
#sheet-overlay.open { display: flex; }
#sheet { background: var(--bg); border-radius: 20px 20px 0 0; width: 100%; max-height: 90dvh; overflow-y: auto; padding: 20px 16px max(20px, env(safe-area-inset-bottom)); }
.sheet-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 0 auto 18px; }
.sheet-title { font-size: 17px; font-weight: 500; margin-bottom: 16px; }
.field { margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--text3); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select, .field textarea { width: 100%; font-size: 15px; font-family: var(--font); padding: 11px 12px; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
.field textarea { resize: none; min-height: 70px; line-height: 1.5; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.field-row .field { margin-bottom: 0; }
.photo-preview { width: 100%; height: 140px; border-radius: var(--radius-sm); object-fit: cover; margin-bottom: 12px; border: 1px solid var(--border); display: none; }
.save-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 500; font-family: var(--font); border: none; border-radius: var(--radius); cursor: pointer; margin-top: 4px; }
.save-btn-w { background: var(--blue); color: #0f172a; }
.save-btn-b { background: var(--amber); color: #0f172a; }
.banner { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; display: none; }
.banner.ok { background: var(--green-bg); color: var(--green-text); }
.banner.err { background: var(--red-bg); color: var(--red-text); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span style="font-size:22px">🧊</span>
    <h1>Diepvries</h1>
  </div>

  <div id="tabs">
    <button class="tab active-w" id="tab-w" onclick="switchTab('winkel')">🛒 Winkel</button>
    <button class="tab" id="tab-b" onclick="switchTab('bereid')">🍳 Bereid</button>
  </div>

  <div id="main">
    <div class="stats" id="stats"></div>
    <div id="banner" class="banner"></div>
    <div class="controls">
      <select id="sort-sel" onchange="renderList()">
        <option value="fifo">⏱ FIFO (oudste eerst)</option>
        <option value="datum">📅 Uiterste datum</option>
        <option value="naam">🔤 Naam A–Z</option>
      </select>
      <input type="search" id="search" placeholder="Zoeken..." oninput="renderList()" />
    </div>
    <div class="list-meta" id="list-meta"></div>
    <div id="items-list"></div>
  </div>

  <div id="bottom-bar">
    <button class="scan-fab" onclick="openScanner()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:block"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><line x1="14" y1="14" x2="21" y2="14"/><line x1="14" y1="18" x2="21" y2="18"/><line x1="18" y1="14" x2="18" y2="21"/></svg>
    </button>
    <button id="fab" class="fab-w" onclick="openAddSheet()">+ Toevoegen</button>
  </div>
</div>

<!-- Scanner -->
<div id="scanner-overlay">
  <div style="position:relative;flex:1;overflow:hidden">
    <video id="scanner-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
    <div class="scanner-frame sf2"><div class="scanner-line"></div></div>
  </div>
  <div class="scanner-ui">
    <div id="scanner-status">Camera wordt gestart...</div>
    <div id="scanner-manual"></div>
    <button class="scanner-close-btn" onclick="closeScanner()">Sluiten</button>
  </div>
</div>

<!-- Add/Edit Sheet -->
<div id="sheet-overlay" onclick="closeSheet(event)">
  <div id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">Product toevoegen</div>
    <div id="sheet-body"></div>
  </div>
</div>

<script>
const ICONS_W={vlees:'🥩',vis:'🐟',groenten:'🥦',fruit:'🍓',brood:'🍞',ijs:'🍦',overig:'📦'};
const ICONS_B={soep:'🍲',stoofpot:'🥘',pasta:'🍝',rijst:'🍚','vlees-b':'🥩','vis-b':'🐟','groente-b':'🥦',baksel:'🥐','overig-b':'🍽️'};
const LABELS_W={vlees:'Vlees',vis:'Vis',groenten:'Groenten',fruit:'Fruit',brood:'Brood',ijs:'IJs',overig:'Overig'};
const LABELS_B={soep:'Soep',stoofpot:'Stoofpot',pasta:'Pasta',rijst:'Rijst','vlees-b':'Vleesgerecht','vis-b':'Visgerecht','groente-b':'Groentegerecht',baksel:'Baksel','overig-b':'Overig'};

let items=[], activeTab='winkel', editId=null;
let scanStream=null, scanInterval=null;
let expandedNotes=new Set();

const today=()=>new Date().toISOString().split('T')[0];

function load(){
  try{ const d=localStorage.getItem('diepvries-v3'); if(d) items=JSON.parse(d); }catch(e){ items=[]; }
  renderAll();
}
function save(){ try{ localStorage.setItem('diepvries-v3', JSON.stringify(items)); }catch(e){} }

function switchTab(t){
  activeTab=t;
  document.getElementById('tab-w').className='tab'+(t==='winkel'?' active-w':'');
  document.getElementById('tab-b').className='tab'+(t==='bereid'?' active-b':'');
  document.getElementById('fab').className='fab-w'+(t==='bereid'?' fab-b':'').replace('fab-w fab-b','fab-b');
  document.getElementById('fab').className= t==='winkel' ? 'save-btn fab-w'.replace('save-btn ','') : 'save-btn fab-b'.replace('save-btn ','');
  document.getElementById('fab').className = t==='winkel' ? 'fab-w' : 'fab-b';
  renderAll();
}

function getDays(d){ if(!d)return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d)-t)/86400000); }

function changeQty(id,delta){
  const it=items.find(i=>i.id===id); if(!it)return;
  const f=it.type==='bereid'?'porties':'qty';
  it[f]=Math.max(0,(it[f]||0)+delta);
  if(it[f]===0){ if(!confirm('Verwijder "'+it.naam+'" uit de lijst?')){ it[f]=1; } else { items=items.filter(i=>i.id!==id); } }
  save(); renderAll();
}
function deleteItem(id){
  const it=items.find(i=>i.id===id); if(!it)return;
  if(confirm('Verwijder "'+it.naam+'"?')){ items=items.filter(i=>i.id!==id); save(); renderAll(); }
}
function toggleNote(id){ if(expandedNotes.has(id)) expandedNotes.delete(id); else expandedNotes.add(id); renderList(); }

function renderStats(){
  const mine=items.filter(i=>i.type===activeTab);
  const total=mine.reduce((s,i)=>s+(i.qty||i.porties||0),0);
  const soon=mine.filter(i=>{ const d=getDays(i.gebruik); return d!==null&&d>=0&&d<=30; }).length;
  const exp=mine.filter(i=>{ const d=getDays(i.gebruik); return d!==null&&d<0; }).length;
  const unit=activeTab==='bereid'?'porties':'stuks';
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-label">Producten</div><div class="stat-value">${mine.length}</div></div>
    <div class="stat"><div class="stat-label">Totaal ${unit}</div><div class="stat-value">${total}</div></div>
    <div class="stat"><div class="stat-label" style="color:${soon>0?'var(--amber)':''}">Bijna op</div><div class="stat-value" style="color:${soon>0?'var(--amber)':''}">${soon}</div></div>
    <div class="stat"><div class="stat-label" style="color:${exp>0?'var(--red)':''}">Verlopen</div><div class="stat-value" style="color:${exp>0?'var(--red)':''}">${exp}</div></div>`;
}

function renderList(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort-sel').value;
  let list=items.filter(i=>i.type===activeTab&&i.naam.toLowerCase().includes(q));
  list.sort((a,b)=>{
    if(sort==='fifo'){ const da=a.invries||'9999',db=b.invries||'9999'; return da<db?-1:da>db?1:0; }
    if(sort==='datum'){ const da=getDays(a.gebruik),db=getDays(b.gebruik); if(da===null&&db===null)return 0; if(da===null)return 1; if(db===null)return -1; return da-db; }
    return a.naam.localeCompare(b.naam,'nl');
  });

  const unit=activeTab==='bereid'?'gerecht':'product';
  document.getElementById('list-meta').textContent=list.length+' '+unit+(list.length!==1?'en':'')+(sort==='fifo'?' · oudste eerst':'');

  if(list.length===0){
    const empty=items.filter(i=>i.type===activeTab).length===0;
    document.getElementById('items-list').innerHTML=`<div class="empty"><div class="empty-icon">${activeTab==='bereid'?'🍳':'🛒'}</div><p>${empty?'Tik op "+ Toevoegen" om te beginnen':'Geen resultaten voor je zoekopdracht'}</p></div>`;
    return;
  }

  const icons=activeTab==='bereid'?ICONS_B:ICONS_W;
  const labels=activeTab==='bereid'?LABELS_B:LABELS_W;

  document.getElementById('items-list').innerHTML=list.map(it=>{
    const dg=getDays(it.gebruik);
    const cls=dg!==null&&dg<0?'expired':dg!==null&&dg<=30?'soon':'';
    const qty=it.type==='bereid'?it.porties:it.qty;
    const unitLbl=it.type==='bereid'?'porties':'stuks';
    const invStr=it.invries?new Date(it.invries).toLocaleDateString('nl-BE',{day:'numeric',month:'short'}):'';
    let dateBadge='';
    if(dg!==null){
      if(dg<0) dateBadge=`<span class="badge b-exp">Verlopen ${Math.abs(dg)}d geleden</span>`;
      else if(dg<=30) dateBadge=`<span class="badge b-soon">Nog ${dg} dag${dg!==1?'en':''}</span>`;
      else dateBadge=`<span class="badge b-ok">Tot ${new Date(it.gebruik).toLocaleDateString('nl-BE',{day:'numeric',month:'short'})}</span>`;
    }
    const fifoBadge=invStr?`<span class="badge b-date">${invStr}</span>`:'';
    const thumbHtml=it.foto
      ?`<div class="card-thumb"><img src="${it.foto}" alt="${it.naam}"></div>`
      :`<div class="card-thumb">${icons[it.cat]||'📦'}</div>`;
    const subText=it.type==='bereid'
      ?`${labels[it.cat]||it.cat}${it.portiegrootte?' · '+it.portiegrootte+'/portie':''}`
      :`${labels[it.cat]||it.cat}${it.eenheid?' · '+it.eenheid:''}`;
    const hasNote=it.type==='bereid'&&it.notitie;
    const noteExp=expandedNotes.has(it.id);
    const footer=`<div class="card-footer">
      ${hasNote?`<button class="foot-btn" onclick="toggleNote(${it.id})">${noteExp?'▲ Verberg notitie':'▼ Toon notitie'}</button>`:''}
      <button class="foot-btn" onclick="openEditSheet(${it.id})" style="margin-left:auto">Bewerken</button>
    </div>`;
    const noteSection=hasNote&&noteExp?`<div class="note-body">${it.notitie.replace(/\n/g,'<br>')}</div>`:'';
    return `<div class="card ${cls}">
      <div class="card-main">
        ${thumbHtml}
        <div class="card-body">
          <div class="card-name">${it.naam}</div>
          <div class="card-sub">${subText}</div>
          <div class="card-badges">${dateBadge}${fifoBadge}</div>
        </div>
        <div class="card-ctrl">
          <div class="qty-row">
            <button class="qb" onclick="changeQty(${it.id},-1)">−</button>
            <span class="qn">${qty}</span>
            <button class="qb" onclick="changeQty(${it.id},1)">+</button>
          </div>
          <div class="unit-lbl">${unitLbl}</div>
          <button class="del-btn" onclick="deleteItem(${it.id})">✕</button>
        </div>
      </div>
      ${footer}
      ${noteSection}
    </div>`;
  }).join('');
}

function renderAll(){ renderStats(); renderList(); }

// ── Sheet ──
function openAddSheet(){
  editId=null;
  document.getElementById('sheet-title').textContent=activeTab==='winkel'?'🛒 Winkelproduct toevoegen':'🍳 Bereid gerecht toevoegen';
  renderSheetBody(null);
  document.getElementById('sheet-overlay').classList.add('open');
}
function openEditSheet(id){
  editId=id;
  const it=items.find(i=>i.id===id); if(!it)return;
  document.getElementById('sheet-title').textContent=it.naam+' bewerken';
  renderSheetBody(it);
  document.getElementById('sheet-overlay').classList.add('open');
}
function closeSheet(e){
  if(e&&e.target!==document.getElementById('sheet-overlay'))return;
  document.getElementById('sheet-overlay').classList.remove('open');
}
function closeSheetDirect(){ document.getElementById('sheet-overlay').classList.remove('open'); }

function renderSheetBody(it){
  const isEdit=!!it;
  const type=it?it.type:activeTab;
  const today_=today();
  if(type==='winkel'){
    document.getElementById('sheet-body').innerHTML=`

      <div class="field-row">
        <div class="field"><label>Categorie</label><select id="s-cat">
          <option value="vlees" ${it&&it.cat==='vlees'?'selected':''}>🥩 Vlees</option>
          <option value="vis" ${it&&it.cat==='vis'?'selected':''}>🐟 Vis</option>
          <option value="groenten" ${it&&it.cat==='groenten'?'selected':''}>🥦 Groenten</option>
          <option value="fruit" ${it&&it.cat==='fruit'?'selected':''}>🍓 Fruit</option>
          <option value="brood" ${it&&it.cat==='brood'?'selected':''}>🍞 Brood</option>
          <option value="ijs" ${it&&it.cat==='ijs'?'selected':''}>🍦 IJs</option>
          <option value="overig" ${it&&it.cat==='overig'?'selected':''}>📦 Overig</option>
        </select></div>
        <div class="field"><label>Aantal</label><input type="number" id="s-qty" value="${it?it.qty:1}" min="1"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Eenheid</label><input type="text" id="s-eenheid" value="${it?it.eenheid||'':''}" placeholder="g / ml / st"></div>
        <div class="field"><label>Barcode</label><input type="text" id="s-barcode" value="${it?it.barcode||'':''}" placeholder="optioneel"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Ingevroren op</label><input type="date" id="s-invries" value="${it?it.invries||today_:today_}"></div>
        <div class="field"><label>Opgebruiken voor</label><input type="date" id="s-gebruik" value="${it?it.gebruik||'':''}"></div>
      </div>
      <div class="field"><label>Snelkeuze bewaartijd</label><select id="s-bewaar" onchange="calcGebruik()">
        <option value="">— geen —</option>
        <option value="30">1 maand</option><option value="60">2 maanden</option>
        <option value="90">3 maanden</option><option value="180">6 maanden</option>
        <option value="270">9 maanden</option><option value="365">12 maanden</option>
      </select></div>
      <div class="field"><label>Foto</label><input type="file" id="s-foto" accept="image/*" style="font-size:13px;padding:8px;color:var(--text2)"></div>
      <img id="s-foto-preview" class="photo-preview" ${it&&it.foto?'src="'+it.foto+'" style="display:block"':''} />
      <button class="save-btn save-btn-w" onclick="saveSheet('winkel')">${isEdit?'Opslaan':'Toevoegen'}</button>`;
  } else {
    document.getElementById('sheet-body').innerHTML=`
      <div class="field"><label>Naam gerecht</label><input type="text" id="s-naam" value="${it?it.naam:''}" placeholder="bijv. tomatensoep"></div>
      <div class="field"><label>Categorie</label><select id="s-cat">
        <option value="soep" ${it&&it.cat==='soep'?'selected':''}>🍲 Soep</option>
        <option value="stoofpot" ${it&&it.cat==='stoofpot'?'selected':''}>🥘 Stoofpot</option>
        <option value="pasta" ${it&&it.cat==='pasta'?'selected':''}>🍝 Pasta</option>
        <option value="rijst" ${it&&it.cat==='rijst'?'selected':''}>🍚 Rijstgerecht</option>
        <option value="vlees-b" ${it&&it.cat==='vlees-b'?'selected':''}>🥩 Vleesgerecht</option>
        <option value="vis-b" ${it&&it.cat==='vis-b'?'selected':''}>🐟 Visgerecht</option>
        <option value="groente-b" ${it&&it.cat==='groente-b'?'selected':''}>🥦 Groentegerecht</option>
        <option value="baksel" ${it&&it.cat==='baksel'?'selected':''}>🥐 Baksel</option>
        <option value="overig-b" ${it&&it.cat==='overig-b'?'selected':''}>🍽️ Overig</option>
      </select></div>
      <div class="field-row">
        <div class="field"><label>Aantal porties</label><input type="number" id="s-porties" value="${it?it.porties:4}" min="1"></div>
        <div class="field"><label>Portiegrootte</label><input type="text" id="s-portiegrootte" value="${it?it.portiegrootte||'':''}" placeholder="bijv. 300g"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Bereid op</label><input type="date" id="s-invries" value="${it?it.invries||today_:today_}"></div>
        <div class="field"><label>Opgebruiken voor</label><input type="date" id="s-gebruik" value="${it?it.gebruik||'':''}"></div>
      </div>
      <div class="field"><label>Snelkeuze bewaartijd</label><select id="s-bewaar" onchange="calcGebruik()">
        <option value="">— geen —</option>
        <option value="30">1 maand</option><option value="60">2 maanden</option>
        <option value="90">3 maanden</option><option value="180">6 maanden</option>
      </select></div>
      <div class="field"><label>Notitie (ingrediënten, tips, smaak)</label><textarea id="s-notitie" placeholder="bijv. zonder zout, extra knoflook...">${it?it.notitie||'':''}</textarea></div>
      <div class="field"><label>Foto</label><input type="file" id="s-foto" accept="image/*" style="font-size:13px;padding:8px;color:var(--text2)"></div>
      <img id="s-foto-preview" class="photo-preview" ${it&&it.foto?'src="'+it.foto+'" style="display:block"':''} />

    if(document.getElementById('s-foto')){
      document.getElementById('s-foto').addEventListener('change',function(){
        const f=this.files[0]; if(!f)return;
        const r=new FileReader(); r.onload=e=>{ const p=document.getElementById('s-foto-preview'); p.src=e.target.result; p.style.display='block'; }; r.readAsDataURL(f);

  }
  // attach listener for winkel foto too
  const wFoto=document.getElementById('s-foto');
  if(wFoto && type==='winkel'){
    wFoto.addEventListener('change',function(){
      const f=this.files[0]; if(!f)return;
      const r=new FileReader(); r.onload=e=>{ const p=document.getElementById('s-foto-preview'); p.src=e.target.result; p.style.display='block'; }; r.readAsDataURL(f);
    });

}

function calcGebruik(){
  const d=document.getElementById('s-bewaar').value; if(!d)return;
  const inv=document.getElementById('s-invries').value||today();
  const dt=new Date(inv); dt.setDate(dt.getDate()+parseInt(d));
  document.getElementById('s-gebruik').value=dt.toISOString().split('T')[0];
}

async function saveSheet(type){
  const naam=document.getElementById('s-naam').value.trim();
  if(!naam){ document.getElementById('s-naam').focus(); return; }
  let item;
  if(type==='winkel'){
    let wFoto='';
    const wFotoFile=document.getElementById('s-foto').files[0];
    if(wFotoFile) wFoto=await new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(wFotoFile); });
    else{ const prev=document.getElementById('s-foto-preview'); if(prev&&prev.dataset.b64) wFoto=prev.dataset.b64; else if(editId){ const old=items.find(i=>i.id===editId); if(old)wFoto=old.foto||''; } }
    item={ type:'winkel', naam, cat:document.getElementById('s-cat').value,
      qty:parseInt(document.getElementById('s-qty').value)||1,
      eenheid:document.getElementById('s-eenheid').value.trim(),
      barcode:document.getElementById('s-barcode').value.trim(),
      foto:wFoto,
      invries:document.getElementById('s-invries').value,
      gebruik:document.getElementById('s-gebruik').value };
  } else {
    let foto='';
    const fFile=document.getElementById('s-foto').files[0];
    if(fFile) foto=await new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(fFile); });
    else if(editId){ const old=items.find(i=>i.id===editId); if(old)foto=old.foto||''; }
    item={ type:'bereid', naam, cat:document.getElementById('s-cat').value,
      porties:parseInt(document.getElementById('s-porties').value)||1,
      portiegrootte:document.getElementById('s-portiegrootte').value.trim(),
      notitie:document.getElementById('s-notitie').value.trim(),
      foto,
      invries:document.getElementById('s-invries').value,
      gebruik:document.getElementById('s-gebruik').value };
  }
  if(editId){ Object.assign(items.find(i=>i.id===editId), item); }
  else { item.id=Date.now(); items.push(item); }
  save(); closeSheetDirect(); renderAll();
}

// ── Scanner ──
async function openScanner(){
  document.getElementById('scanner-overlay').classList.add('open');
  document.getElementById('scanner-status').textContent='Camera wordt gestart...';
  document.getElementById('scanner-manual').textContent='';
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
    const vid=document.getElementById('scanner-video');
    vid.srcObject=scanStream; vid.play();
    document.getElementById('scanner-status').textContent='Richt de camera op een barcode';
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e']});
      scanInterval=setInterval(async()=>{
        if(vid.readyState<2)return;
        try{ const bs=await det.detect(vid); if(bs.length>0) onBarcode(bs[0].rawValue); }catch(e){}
      },400);
    } else {
      document.getElementById('scanner-manual').textContent='Automatisch scannen niet beschikbaar op dit toestel.';
    }
  }catch(e){
    document.getElementById('scanner-status').textContent='Camera niet beschikbaar — controleer je instellingen';
  }
}
function closeScanner(){
  if(scanStream) scanStream.getTracks().forEach(t=>t.stop());
  scanStream=null; if(scanInterval) clearInterval(scanInterval); scanInterval=null;
  document.getElementById('scanner-overlay').classList.remove('open');
}
async function onBarcode(code){
  closeScanner();
  openAddSheet();
  setTimeout(()=>{
    const el=document.getElementById('s-barcode'); if(el) el.value=code;
    const st=document.getElementById('scanner-status'); if(st) st.textContent='Barcode gescand: '+code;
  },100);
  showBanner('Barcode gescand: '+code+' — productinfo ophalen...','ok');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v0/product/'+code+'.json');
    const d=await r.json();
    if(d.status===1&&d.product){
      const p=d.product;
      const naam=p.product_name_nl||p.product_name||'';
      if(naam){ const el=document.getElementById('s-naam'); if(el) el.value=naam; }
      const cats=p.categories_tags||[];
      let cat='overig';
      if(cats.some(c=>c.includes('meat')||c.includes('vlees'))) cat='vlees';
      else if(cats.some(c=>c.includes('fish')||c.includes('seafood')||c.includes('vis'))) cat='vis';
      else if(cats.some(c=>c.includes('vegetable')||c.includes('groente'))) cat='groenten';
      else if(cats.some(c=>c.includes('fruit'))) cat='fruit';
      else if(cats.some(c=>c.includes('bread')||c.includes('brood'))) cat='brood';
      else if(cats.some(c=>c.includes('ice-cream')||c.includes('ijs'))) cat='ijs';
      const elCat=document.getElementById('s-cat'); if(elCat) elCat.value=cat;
      // Load product image from Open Food Facts
      const imgUrl=p.image_front_small_url||p.image_front_url||p.image_url||'';
      if(imgUrl){
        // Fetch image and convert to base64 so it saves with the product
        try{
          const imgResp=await fetch(imgUrl);
          const blob=await imgResp.blob();
          const b64=await new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(blob); });
          const prev=document.getElementById('s-foto-preview');
          if(prev){ prev.src=b64; prev.style.display='block'; prev.dataset.b64=b64; }
          showBanner('✓ '+(naam||code)+' gevonden met foto!','ok');
        }catch(imgErr){
          showBanner('✓ '+(naam||code)+' gevonden!','ok');
        }
      } else {
        showBanner('✓ '+(naam||code)+' gevonden!','ok');
      }
    } else { showBanner('Barcode '+code+' — product niet gevonden, vul naam in','err'); }
  }catch(e){ showBanner('Barcode gescand: '+code,'ok'); }
}

function showBanner(msg,type){
  const el=document.getElementById('banner');
  el.textContent=msg; el.className='banner '+(type==='ok'?'ok':'err');
  el.style.display='block'; setTimeout(()=>el.style.display='none',4000);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
